name: adv_ds
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - scikit-learn
  - jupyterlab
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - ipykernel
  - pip
  - pip:
      - ipywidgets
post_create:
  - python -m ipykernel install --user --name=adv_ds --display-name "Python (adv_ds)"
prefix: /opt/anaconda3/envs/adv_ds